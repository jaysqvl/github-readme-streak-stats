name: Format with Prettier

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/prettier.yml"
      - "**.php"
      - "**.md"
      - "**.js"
      - "**.css"

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned formatter tools outside the source tree
        run: |
          npm install --prefix "$RUNNER_TEMP/php-format" prettier@3.9.9 @prettier/plugin-php@0.25.0 --ignore-scripts --no-audit --no-fund
          npm audit --prefix "$RUNNER_TEMP/php-format" --audit-level=low
      - name: Report existing formatting differences
        # Preserve the original non-blocking style report. No source reformatting
        # is committed as part of dependency maintenance.
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/php-format/node_modules/.bin/prettier" --plugin "$RUNNER_TEMP/php-format/node_modules/@prettier/plugin-php/src/index.mjs" --check '*.md' '**/*.{php,md,js,css}' '!**/*.min.js' --print-width 120
      - name: Verify full-source formatter compatibility and idempotence
        # This disposable checkout has no stored Git credentials or write token.
        # Explicit plugin loading is required by Prettier 3. Never push these edits.
        run: |
          "$RUNNER_TEMP/php-format/node_modules/.bin/prettier" --plugin "$RUNNER_TEMP/php-format/node_modules/@prettier/plugin-php/src/index.mjs" --write '*.md' '**/*.{php,md,js,css}' '!**/*.min.js' --print-width 120
          "$RUNNER_TEMP/php-format/node_modules/.bin/prettier" --plugin "$RUNNER_TEMP/php-format/node_modules/@prettier/plugin-php/src/index.mjs" --check '*.md' '**/*.{php,md,js,css}' '!**/*.min.js' --print-width 120
